# =====================================================================
# ARMS application messages (SRS 7.4: user-visible text lives in
# resource files external to the compiled code)
# =====================================================================

# --- general errors ---------------------------------------------------
error.notFound=The requested record was not found.
error.badRequest=The request could not be processed as submitted.
error.unauthorized=The username or password is incorrect.
error.forbidden=You do not have permission to perform this action.
error.internal=An unexpected error occurred. Please contact the administrator.
error.passwordChangeRequired=You must change your password before continuing.
validation.error=One or more fields are invalid.

# --- shared validation ------------------------------------------------
common.invalidPeriod=The start date must not be after the end date.

# --- apartments (FR-1.1) ----------------------------------------------
apartment.notFound=The requested apartment was not found.
apartment.nameExists=An apartment with this name already exists.

# --- rooms (FR-1.2 - FR-1.7) -------------------------------------------
room.notFound=The requested room was not found.
room.apartmentNotFound=The specified apartment was not found or is not active.
room.numberExists=Room number {0} already exists in this apartment.
room.alreadyUnderMaintenance=This room is already under maintenance.
room.notUnderMaintenance=This room is not under maintenance.
room.activeRentalExists=This room has an active rental. Confirm to place it under maintenance anyway; the tenant arrangement remains on record.

# --- tenants (FR-2.1 - FR-2.5) -----------------------------------------
tenant.notFound=The requested tenant was not found.
tenant.hasRentals=This tenant cannot be deleted because rental records refer to it.

# --- rentals (FR-3.1 - FR-3.7) -----------------------------------------
rental.notFound=The requested rental was not found.
rental.tenantNotFound=The specified tenant was not found.
rental.roomNotFound=The specified room was not found.
rental.roomDeactivated=The specified room is not active.
rental.invalidPeriod=The end date must be later than the start date.
rental.underMaintenance=A room under maintenance cannot be allocated to a new rental.
rental.overlapping=The room is already allocated to another rental for these dates.
rental.alreadyStarted=A rental that has started can no longer be amended or cancelled.
rental.notActive=Only an active rental can be changed.
rental.notStarted=This rental has not started yet.

# --- payments (FR-4.1 - FR-4.6) ----------------------------------------
payment.notFound=The requested payment was not found.
payment.rentalNotFound=The specified rental was not found.
payment.rentalCancelled=Payments cannot be recorded against a cancelled rental.
payment.alreadyReversed=This payment has already been reversed.
payment.reversalTarget=A reversing entry cannot itself be reversed; correct the original instead.

# --- users (FR-7.1 - FR-7.4) -------------------------------------------
user.notFound=The requested user was not found.
user.usernameExists=A user with this username already exists.
user.selfDisable=You cannot disable your own account.

# --- authentication ----------------------------------------------------
auth.passwordMismatch=The current password you entered is incorrect.
auth.passwordSame=The new password must be different from the current password.

# --- search (FR-5.3) ---------------------------------------------------
search.invalidType=Search type must be one of apartment, room or tenant.
