# =====================================================================
# Server-side validation messages (SRS NFR-SE-4: validate all input on
# the server before it is persisted; SRS 3.1: messages state what is
# wrong and appear next to the field concerned)
# =====================================================================
jakarta.validation.constraints.NotBlank.message=This field is required.
jakarta.validation.constraints.NotNull.message=This field is required.
jakarta.validation.constraints.Size.message=Length must be between {min} and {max} characters.
jakarta.validation.constraints.Email.message=Enter a valid email address.
jakarta.validation.constraints.DecimalMin.message=Enter a value of at least {value}.
jakarta.validation.constraints.Digits.message=Enter a value with at most {integer} integer digits and {fraction} decimal places.
